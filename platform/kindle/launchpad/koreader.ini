[Actions]
# start universalreader with filebrowser in /mnt/us/documents
P D = !/mnt/us/universalreader/universalreader.sh /mnt/us/documents
# start universalreader with last document
P P = !/mnt/us/universalreader/universalreader.sh
# start universalreader without framework in /mnt/us/documents
P K = !/mnt/us/universalreader/universalreader.sh --framework_stop /mnt/us/documents
# start universalreader without framework on last read document
P L = !/mnt/us/universalreader/universalreader.sh --framework_stop
# restart amazon framework - when it got irritated
P R = !/etc/init.d/framework restart
